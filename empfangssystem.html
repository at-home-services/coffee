<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Kaffeekarte – Bestelleingang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.29.0/dist/tabler-icons.min.css">
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #17120e; --bg2: #211812; --surface-solid: #251b14;
      --surface: rgba(255,248,238,0.08); --surface2: rgba(255,248,238,0.12);
      --border: rgba(245,220,178,0.16); --border2: rgba(245,220,178,0.28);
      --text: #F7EFE2; --text2: #B8A68E;
      --accent: #C8862A; --accent-bg: rgba(200,134,42,0.15); --accent-border: rgba(200,134,42,0.42); --accent-text: #F0C36A;
      --roast-light: #6B3E16; --roast-hover: #7E4C1E;
      --green: #97C459; --green-bg: rgba(151,196,89,0.13); --green-text: #CBE7A2; --green-border: rgba(151,196,89,0.32);
      --amber-bg: rgba(239,159,39,0.14); --amber-text: #FAC775; --amber-border: rgba(239,159,39,0.34);
      --purple-bg: rgba(127,119,221,0.13); --purple-text: #C4BEFF; --purple-border: rgba(127,119,221,0.34);
      --red-bg: rgba(226,75,74,0.13); --red-text: #F09595; --red-border: rgba(226,75,74,0.35);
      --radius: 18px; --radius-sm: 12px;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(200,134,42,0.22), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(127,119,221,0.12), transparent 32rem),
        linear-gradient(145deg, var(--bg), var(--bg2));
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .container.locked { display: none; }
    header {
      display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px;
      background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
      border: 1px solid var(--border); border-radius: 22px; padding: 28px;
      box-shadow: 0 24px 70px rgba(0,0,0,.24); position: relative; overflow: hidden;
    }
    header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 120%, rgba(200,134,42,.24), transparent 70%); pointer-events: none; }
    header > * { position: relative; z-index: 1; }
    .header-left h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 500; color: var(--text); line-height: 1; }
    .header-left p { font-size: 12px; color: var(--text2); margin-top: 8px; letter-spacing: .14em; text-transform: uppercase; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .live-indicator { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text2); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 7px 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text2); }
    .dot.on { background: var(--green); } .dot.err { background: #E24B4A; }
    .btn-icon { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 8px 13px; font-size: 12px; font-family: inherit; color: var(--text2); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.15s; }
    .btn-icon:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); transform: translateY(-1px); }
    .btn-icon.sound-on { color: var(--accent-text); border-color: var(--accent-border); background: var(--accent-bg); }
    .btn-icon.highlight { color: var(--accent-text); border-color: var(--accent-border); }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 18px 0 22px; }
    .stat { background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.045)); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px 16px; text-align: center; box-shadow: 0 14px 36px rgba(0,0,0,.14); }
    .stat .n { font-size: 32px; font-weight: 500; color: var(--text); line-height: 1; }
    .stat .l { font-size: 11px; color: var(--text2); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.10em; }
    .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .ftag { font-size: 12px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,.03); color: var(--text2); cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .ftag:hover { border-color: var(--border2); color: var(--text); background: var(--surface); }
    .ftag.active { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent-text); font-weight: 500; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
    .toolbar span { font-size: 12px; color: var(--text2); }
    .orders-list { display: flex; flex-direction: column; gap: 12px; }
    .order-card { background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.045)); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: 0 16px 44px rgba(0,0,0,.16); }
    .order-card.is-new { border-color: var(--accent-border); box-shadow: 0 18px 48px rgba(200,134,42,.12); }
    .order-card.is-done { opacity: 0.55; }
    @keyframes slideIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    .order-card.animate { animation: slideIn 0.25s ease; }
    .oc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .oc-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge-table { background: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
    .oc-num { font-size: 12px; font-weight: 500; color: var(--text2); }
    .badge { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
    .badge-new   { background: var(--accent-bg); color: var(--accent-text); border: 1px solid var(--accent-border); }
    .badge-ready { background: var(--amber-bg);  color: var(--amber-text);  border: 1px solid var(--amber-border); }
    .badge-done  { background: var(--green-bg);  color: var(--green-text);  border: 1px solid var(--green-border); }
    .badge-waiter { background: var(--purple-bg); color: var(--purple-text); border: 1px solid var(--purple-border); font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
    .oc-time { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .oc-items { font-size: 15px; color: var(--text); line-height: 1.65; margin-bottom: 8px; }
    .oc-qty { color: var(--text2); font-size: 13px; }
    .oc-extras { font-size: 11px; color: var(--amber-text); background: var(--amber-bg); border: 1px solid var(--amber-border); border-radius: 8px; padding: 1px 6px; white-space: nowrap; }
    .oc-note { font-size: 12px; color: var(--text2); display: flex; align-items: flex-start; gap: 6px; margin-bottom: 10px; padding: 9px 11px; background: rgba(0,0,0,.14); border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .oc-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--border); }
    .btn-action { font-size: 12px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,.03); color: var(--text2); cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
    .btn-action:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); transform: translateY(-1px); }
    .btn-progress { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent-text); }
    .btn-progress:hover { background: rgba(200,134,42,0.22); color: var(--accent-text); }
    .btn-done-action { background: var(--green-bg); border-color: var(--green-border); color: var(--green-text); }
    .btn-done-action:hover { background: rgba(151,196,89,0.2); }
    .btn-del { margin-left: auto; }
    .btn-del:hover { background: var(--red-bg); color: var(--red-text); border-color: var(--red-border); }
    .empty { text-align: center; padding: 52px 0; color: var(--text2); border: 1px dashed var(--border); border-radius: var(--radius); background: rgba(255,255,255,.03); }
    .empty i { font-size: 34px; display: block; margin: 0 auto 10px; opacity: 0.5; }
    .empty p { font-size: 14px; }

    /* ── PIN-Sperre ── */
    #pin-gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 200; }
    #pin-gate.hidden { display: none; }
    .pin-card { width: 100%; max-width: 340px; text-align: center; background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.04)); border: 1px solid var(--border); border-radius: 22px; padding: 32px 24px; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
    .pin-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--accent-bg); border: 1px solid var(--accent-border); color: var(--accent-text); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 26px; }
    .pin-card h2 { font-family: 'Playfair Display', serif; font-weight: 500; font-size: 1.6rem; }
    .pin-card p { font-size: 13px; color: var(--text2); margin: 6px 0 20px; }
    .pin-input { width: 100%; font-family: inherit; font-size: 26px; letter-spacing: .6em; text-align: center; padding: 12px 0 12px .6em; border-radius: var(--radius-sm); border: 1px solid var(--border); background: rgba(0,0,0,.25); color: var(--text); outline: none; }
    .pin-input:focus { border-color: var(--accent-border); }
    .pin-error { min-height: 20px; font-size: 13px; color: var(--red-text); margin-top: 10px; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .shake { animation: shake .3s; }
    .btn-primary { width: 100%; margin-top: 6px; background: var(--roast-light); border: 1px solid var(--accent-border); border-radius: var(--radius-sm); padding: 11px; font-size: 14px; font-weight: 500; font-family: inherit; color: #F5ECD7; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s; }
    .btn-primary:hover { background: var(--roast-hover); }

    /* ── Getränke-Editor ── */
    #menu-editor { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(3px); z-index: 150; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; }
    #menu-editor.open { display: flex; }
    .editor { width: 100%; max-width: 720px; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 22px; padding: 24px; box-shadow: 0 24px 70px rgba(0,0,0,.5); }
    .editor-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
    .editor-head h2 { font-family: 'Playfair Display', serif; font-weight: 500; font-size: 1.5rem; }
    .editor-sub { font-size: 12px; color: var(--text2); margin-bottom: 18px; }
    .cat-box { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px; }
    .cat-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .cat-head i { color: var(--accent-text); font-size: 18px; }
    .ed-input { flex: 1; min-width: 0; font-family: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,0,0,.25); color: var(--text); outline: none; }
    .ed-input:focus { border-color: var(--accent-border); }
    .cat-name { font-weight: 600; }
    .ed-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .ed-del { flex-shrink: 0; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .ed-del:hover { background: var(--red-bg); color: var(--red-text); border-color: var(--red-border); }
    .ed-add { margin-top: 4px; font-size: 12px; padding: 7px 12px; border-radius: 999px; border: 1px dashed var(--accent-border); background: transparent; color: var(--accent-text); cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 5px; }
    .ed-add:hover { background: var(--accent-bg); }
    .ed-section { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .1em; margin: 20px 0 10px; }
    .editor-foot { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; justify-content: flex-end; border-top: 1px solid var(--border); padding-top: 16px; }
    .editor-foot .btn-primary { width: auto; margin: 0; padding: 9px 18px; font-size: 13px; }
    .editor-foot .spacer { flex: 1; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green-text); backdrop-filter: blur(10px); padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 300; display: none; }
    .toast.show { display: block; animation: slideIn .2s ease; }

    @media (max-width: 640px) {
      body { padding: 14px 12px 36px; }
      header { padding: 22px; }
      .stats { grid-template-columns: 1fr; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .oc-top { flex-direction: column; }
      .editor { padding: 18px; }
    }
  </style>
</head>
<body>

<!-- ── PIN-Sperre ── -->
<div id="pin-gate">
  <form class="pin-card" id="pin-card" onsubmit="checkPin(event)">
    <div class="pin-icon"><i class="ti ti-lock" aria-hidden="true"></i></div>
    <h2>Empfangssystem</h2>
    <p>Bitte PIN eingeben</p>
    <input class="pin-input" id="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN" autofocus>
    <div class="pin-error" id="pin-error"></div>
    <button class="btn-primary" type="submit"><i class="ti ti-lock-open" aria-hidden="true"></i> Entsperren</button>
  </form>
</div>

<div class="container locked" id="app">
  <header>
    <div class="header-left">
      <h1>Bestelleingang</h1>
      <p>Kaffeekarte – Empfangssystem</p>
    </div>
    <div class="header-right">
      <button class="btn-icon highlight" onclick="openEditor()"><i class="ti ti-pencil" aria-hidden="true"></i> Getränke</button>
      <button class="btn-icon" id="snd-btn" onclick="toggleSound()"><i class="ti ti-bell" aria-hidden="true"></i><span id="snd-label">Ton</span></button>
      <button class="btn-icon" onclick="clearDone()"><i class="ti ti-trash" aria-hidden="true"></i> Erledigte</button>
      <button class="btn-icon" onclick="lockApp()" aria-label="Sperren"><i class="ti ti-lock" aria-hidden="true"></i></button>
      <div class="live-indicator"><span class="dot" id="live-dot"></span><span id="live-label">Verbinde…</span></div>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="stat-total">0</div><div class="l">Gesamt</div></div>
    <div class="stat"><div class="n" id="stat-open">0</div><div class="l">Offen</div></div>
    <div class="stat"><div class="n" id="stat-done">0</div><div class="l">Fertig</div></div>
  </div>

  <div class="filters">
    <button class="ftag active" data-f="all"   onclick="setFilter('all')">Alle</button>
    <button class="ftag"        data-f="new"   onclick="setFilter('new')">Neu</button>
    <button class="ftag"        data-f="ready" onclick="setFilter('ready')">In Zubereitung</button>
    <button class="ftag"        data-f="done"  onclick="setFilter('done')">Ausgegeben</button>
  </div>

  <div class="toolbar">
    <span id="count-label"></span>
    <button class="btn-icon" onclick="addDemo()"><i class="ti ti-plus" aria-hidden="true"></i> Testbestellung</button>
  </div>

  <div class="orders-list" id="orders-list"></div>
</div>

<!-- ── Getränke-Editor ── -->
<div id="menu-editor" onclick="if(event.target===this)closeEditor()">
  <div class="editor">
    <div class="editor-head">
      <h2>Getränkekarte</h2>
      <button class="btn-icon" onclick="closeEditor()" aria-label="Schließen"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <p class="editor-sub">Änderungen werden nach dem Speichern sofort an alle offenen Bestellsysteme übertragen.</p>
    <div id="editor-cats"></div>
    <button class="ed-add" onclick="addCategory()"><i class="ti ti-plus" aria-hidden="true"></i> Kategorie hinzufügen</button>
    <div class="ed-section">Extras (für jedes Getränk wählbar)</div>
    <div id="editor-extras"></div>
    <div class="editor-foot">
      <button class="btn-icon" onclick="resetMenuDraft()"><i class="ti ti-restore" aria-hidden="true"></i> Standard</button>
      <span class="spacer"></span>
      <button class="btn-icon" onclick="closeEditor()">Abbrechen</button>
      <button class="btn-primary" onclick="saveMenu()"><i class="ti ti-device-floppy" aria-hidden="true"></i> Speichern</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script>
const ABLY_KEY = "IBM0rw.gGiVMw:X9LuWW5mM497fbE2SDIuLQrVE7DIj6HltJVriS48a1c";
const PIN = "1234";
const ORDERS_KEY = "kaffee-orders";
const MENU_KEY = "kaffee-menu";

const DEFAULT_MENU = {
  updatedAt: 0,
  categories: [
    { name: "Klassiker",               icon: "ti-coffee",    items: ["Espresso","Ristretto","Espresso Lungo","Americano","Kaffee","Caffè Crema"] },
    { name: "Milchspezialitäten",      icon: "ti-droplet",   items: ["Cappuccino","Flat White","Latte Macchiato","Caffè Latte","Café au Lait"] },
    { name: "Eiskaffee & Cold Drinks", icon: "ti-snowflake", items: ["Eisgekühlter Kaffee","Iced Espresso","Iced Americano","Iced Caffè Crema","Iced Cappuccino","Iced Latte","Iced Café au Lait","Iced Caffè Latte"] },
    { name: "Weiteres",                icon: "ti-dots",      items: ["Coffee-to-go","Heißes Wasser","Milchschaum"] }
  ],
  extras: ["Zucker", "Laktosefrei", "Extra Milch"]
};

let orders = [];
let filter = "all";
let soundOn = false;
let audioCtx = null;
let ably = null, channel = null, menuChannel = null;
let menu = loadMenu();
let draft = null;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }

// ── PIN ───────────────────────────────────────────────────────────────────────
function checkPin(e) {
  e.preventDefault();
  const input = document.getElementById("pin-input");
  if (input.value === PIN) {
    try { sessionStorage.setItem("kaffee-unlocked", "1"); } catch (err) {}
    unlock();
  } else {
    document.getElementById("pin-error").textContent = "Falscher PIN";
    const card = document.getElementById("pin-card");
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    input.value = ""; input.focus();
  }
}
function unlock() {
  document.getElementById("pin-gate").classList.add("hidden");
  document.getElementById("app").classList.remove("locked");
  document.getElementById("pin-input").value = "";
  document.getElementById("pin-error").textContent = "";
  if (!ably) initAbly();
  render(false);
}
function lockApp() {
  try { sessionStorage.removeItem("kaffee-unlocked"); } catch (err) {}
  closeEditor();
  document.getElementById("app").classList.add("locked");
  document.getElementById("pin-gate").classList.remove("hidden");
  document.getElementById("pin-input").focus();
}

// ── Speicher ─────────────────────────────────────────────────────────────────
function loadOrders() {
  try { const o = JSON.parse(localStorage.getItem(ORDERS_KEY)); if (Array.isArray(o)) return o; } catch (e) {}
  return [];
}
function saveOrders() {
  try { localStorage.setItem(ORDERS_KEY, JSON.stringify(orders)); } catch (e) {}
}
function validMenu(m) {
  return m && Array.isArray(m.categories) && Array.isArray(m.extras) &&
    m.categories.every(c => c && typeof c.name === "string" && Array.isArray(c.items));
}
function loadMenu() {
  try { const m = JSON.parse(localStorage.getItem(MENU_KEY)); if (validMenu(m)) return m; } catch (e) {}
  return clone(DEFAULT_MENU);
}

// ── Ably ─────────────────────────────────────────────────────────────────────
function initAbly() {
  ably = new Ably.Realtime({ key: ABLY_KEY });
  ably.connection.on('connected', () => {
    document.getElementById('live-dot').className = 'dot on';
    document.getElementById('live-label').textContent = 'Live';
  });
  ably.connection.on('failed', () => {
    document.getElementById('live-dot').className = 'dot err';
    document.getElementById('live-label').textContent = 'Fehler';
  });
  ably.connection.on('disconnected', () => {
    document.getElementById('live-dot').className = 'dot err';
    document.getElementById('live-label').textContent = 'Getrennt';
  });

  channel = ably.channels.get('kaffee-bestellungen');
  channel.subscribe('neue-bestellung', (msg) => {
    const o = msg.data;
    if (!o || o.id == null) return;
    if (orders.some(x => x.id === o.id)) return; // eigenes Echo / doppelt -> ignorieren
    orders.unshift(o);
    saveOrders();
    playBeep();
    render(true);
  });
  channel.subscribe('status-update', (msg) => {
    const o = orders.find(x => x.id === msg.data.id);
    if (o && o.status !== msg.data.status) { o.status = msg.data.status; saveOrders(); render(false); }
  });
  channel.subscribe('delete-order', (msg) => {
    const ids = msg.data.ids || [msg.data.id];
    const before = orders.length;
    orders = orders.filter(x => !ids.includes(x.id));
    if (orders.length !== before) { saveOrders(); render(false); }
  });

  // Getränkekarte: Bestellsysteme fragen beim Start nach der aktuellen Karte
  menuChannel = ably.channels.get('kaffee-karte');
  menuChannel.subscribe('menu-request', () => {
    if (menu.updatedAt > 0) menuChannel.publish('menu-update', menu).catch(() => {});
  });
  menuChannel.subscribe('menu-update', (msg) => {
    const m = msg.data;
    if (validMenu(m) && (m.updatedAt || 0) > (menu.updatedAt || 0)) {
      menu = m;
      try { localStorage.setItem(MENU_KEY, JSON.stringify(m)); } catch (e) {}
    }
  });
}

function publish(ch, name, data) {
  if (!ch) return;
  ch.publish(name, data).catch(() => showToast("Senden fehlgeschlagen – Verbindung prüfen", true));
}

// ── Ton ──────────────────────────────────────────────────────────────────────
function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('snd-label').textContent = soundOn ? 'Ton an' : 'Ton';
  document.getElementById('snd-btn').classList.toggle('sound-on', soundOn);
}
function playBeep() {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1100].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = "sine"; osc.frequency.value = freq;
      const t = audioCtx.currentTime + i * 0.15;
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t); osc.stop(t + 0.3);
    });
  } catch(e) {}
}

// ── Bestellungen ─────────────────────────────────────────────────────────────
function addDemo() {
  const all = menu.categories.flatMap(c => c.items);
  if (!all.length) return;
  const pick = [];
  const n = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < n; i++) {
    const name = all[Math.floor(Math.random() * all.length)];
    if (!pick.some(p => p.name === name)) pick.push({ name, qty: 1 + Math.floor(Math.random() * 2), extras: [] });
  }
  const order = { id: Date.now(), time: new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}), items: pick, note: "", table: 1 + Math.floor(Math.random() * 10), status: "new" };
  orders.unshift(order);
  saveOrders();
  publish(channel, "neue-bestellung", order);
  playBeep();
  render(true);
}

function setStatus(id, status) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  o.status = status;
  saveOrders();
  publish(channel, "status-update", { id, status });
  render(false);
}

function deleteOrder(id) {
  orders = orders.filter(x => x.id !== id);
  saveOrders();
  publish(channel, "delete-order", { id });
  render(false);
}

function clearDone() {
  const doneIds = orders.filter(x => x.status === "done").map(x => x.id);
  if (!doneIds.length) { showToast("Keine erledigten Bestellungen"); return; }
  orders = orders.filter(x => x.status !== "done");
  saveOrders();
  publish(channel, "delete-order", { ids: doneIds });
  render(false);
  showToast(`${doneIds.length} erledigte Bestellung${doneIds.length !== 1 ? "en" : ""} gelöscht`);
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll(".ftag").forEach(t => t.classList.toggle("active", t.dataset.f === f));
  render(false);
}

function render(animate) {
  const total = orders.length;
  const open  = orders.filter(o => o.status !== "done").length;
  const done  = orders.filter(o => o.status === "done").length;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-open").textContent  = open;
  document.getElementById("stat-done").textContent  = done;

  const filtered = filter === "all" ? orders : orders.filter(o => o.status === filter);
  document.getElementById("count-label").textContent = `${filtered.length} Bestellung${filtered.length !== 1 ? "en" : ""}`;

  const list = document.getElementById("orders-list");
  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><i class="ti ti-inbox" aria-hidden="true"></i><p>Keine Bestellungen${filter !== "all" ? " in dieser Kategorie" : ""}</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(o => {
    const id = Number(o.id);
    const itemsHtml = (o.items || []).map(i => {
      const extrasStr = i.extras && i.extras.length ? ` <span class="oc-extras">${esc(i.extras.join(", "))}</span>` : "";
      return `${esc(i.name)}${i.qty > 1 ? ` <span class="oc-qty">×${Number(i.qty)}</span>` : ""}${extrasStr}`;
    }).join(" &nbsp;·&nbsp; ");
    const badge = o.status === "new"
      ? `<span class="badge badge-new">Neu</span>`
      : o.status === "ready"
      ? `<span class="badge badge-ready">Zubereitung</span>`
      : `<span class="badge badge-done">Ausgegeben</span>`;
    const del = `<button class="btn-action btn-del" data-act="delete" data-id="${id}"><i class="ti ti-trash" aria-hidden="true"></i> Löschen</button>`;
    let actions = "";
    if (o.status === "new") {
      actions = `<button class="btn-action btn-progress" data-act="ready" data-id="${id}"><i class="ti ti-coffee" aria-hidden="true"></i> In Zubereitung</button>${del}`;
    } else if (o.status === "ready") {
      actions = `<button class="btn-action btn-done-action" data-act="done" data-id="${id}"><i class="ti ti-check" aria-hidden="true"></i> Ausgegeben</button><button class="btn-action" data-act="new" data-id="${id}"><i class="ti ti-arrow-left" aria-hidden="true"></i> Zurück</button>${del}`;
    } else {
      actions = del;
    }
    return `<div class="order-card ${o.status==='new'?'is-new':''} ${o.status==='done'?'is-done':''} ${animate?'animate':''}">
      <div class="oc-top"><div class="oc-left"><span class="oc-num">#${String(id).slice(-4)}</span>${badge}${o.table ? `<span class="badge-table"><i class="ti ti-armchair" aria-hidden="true"></i> Tisch ${esc(o.table)}</span>` : ""}${o.waiter ? `<span class="badge-waiter"><i class="ti ti-user" aria-hidden="true"></i> ${esc(o.waiter)}</span>` : ""}</div><span class="oc-time"><i class="ti ti-clock" aria-hidden="true"></i> ${esc(o.time)}</span></div>
      <div class="oc-items">${itemsHtml}</div>
      ${o.note ? `<div class="oc-note"><i class="ti ti-message" aria-hidden="true"></i> ${esc(o.note)}</div>` : ""}
      <div class="oc-actions">${actions}</div>
    </div>`;
  }).join("");
}

// Ein zentraler Klick-Handler für alle Bestell-Buttons
document.getElementById("orders-list").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const id = Number(btn.dataset.id);
  const act = btn.dataset.act;
  if (act === "delete") deleteOrder(id);
  else setStatus(id, act);
});

// ── Getränke-Editor ──────────────────────────────────────────────────────────
function openEditor() {
  draft = clone(menu);
  renderEditor();
  document.getElementById("menu-editor").classList.add("open");
}
function closeEditor() {
  document.getElementById("menu-editor").classList.remove("open");
  draft = null;
}
function resetMenuDraft() {
  if (!confirm("Getränkekarte auf den Standard zurücksetzen?")) return;
  draft = clone(DEFAULT_MENU);
  renderEditor();
}

function renderEditor() {
  const cats = document.getElementById("editor-cats");
  cats.innerHTML = draft.categories.map((c, ci) => `
    <div class="cat-box">
      <div class="cat-head">
        <i class="ti ${/^ti-[a-z0-9-]+$/.test(c.icon || "") ? c.icon : "ti-coffee"}" aria-hidden="true"></i>
        <input class="ed-input cat-name" data-cat="${ci}" value="${esc(c.name)}" placeholder="Kategorie-Name">
        <button class="ed-del" data-delcat="${ci}" title="Kategorie löschen" aria-label="Kategorie löschen"><i class="ti ti-trash"></i></button>
      </div>
      ${c.items.map((it, ii) => `
        <div class="ed-row">
          <input class="ed-input" data-cat="${ci}" data-item="${ii}" value="${esc(it)}" placeholder="Getränk">
          <button class="ed-del" data-cat="${ci}" data-delitem="${ii}" title="Entfernen" aria-label="Getränk entfernen"><i class="ti ti-x"></i></button>
        </div>`).join("")}
      <button class="ed-add" data-additem="${ci}"><i class="ti ti-plus" aria-hidden="true"></i> Getränk</button>
    </div>`).join("");

  document.getElementById("editor-extras").innerHTML = `
    <div class="cat-box">
      ${draft.extras.map((ex, xi) => `
        <div class="ed-row">
          <input class="ed-input" data-extra="${xi}" value="${esc(ex)}" placeholder="Extra">
          <button class="ed-del" data-delextra="${xi}" title="Entfernen" aria-label="Extra entfernen"><i class="ti ti-x"></i></button>
        </div>`).join("")}
      <button class="ed-add" data-addextra="1"><i class="ti ti-plus" aria-hidden="true"></i> Extra</button>
    </div>`;
}

function addCategory() {
  draft.categories.push({ name: "Neue Kategorie", icon: "ti-coffee", items: [""] });
  renderEditor();
  const inputs = document.querySelectorAll("#editor-cats .cat-name");
  const last = inputs[inputs.length - 1];
  if (last) { last.focus(); last.select(); }
}

// Eingaben direkt in den Entwurf schreiben
document.getElementById("menu-editor").addEventListener("input", (e) => {
  const t = e.target;
  if (!draft || !t.classList.contains("ed-input")) return;
  if (t.dataset.extra != null) draft.extras[+t.dataset.extra] = t.value;
  else if (t.dataset.item != null) draft.categories[+t.dataset.cat].items[+t.dataset.item] = t.value;
  else if (t.dataset.cat != null) draft.categories[+t.dataset.cat].name = t.value;
});

document.getElementById("menu-editor").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || !draft) return;
  const d = b.dataset;
  let focusSel = null;
  if (d.delcat != null) {
    const c = draft.categories[+d.delcat];
    if (!confirm(`Kategorie "${c.name}" mit ${c.items.filter(Boolean).length} Getränk(en) löschen?`)) return;
    draft.categories.splice(+d.delcat, 1);
  } else if (d.delitem != null) {
    draft.categories[+d.cat].items.splice(+d.delitem, 1);
  } else if (d.additem != null) {
    const ci = +d.additem;
    draft.categories[ci].items.push("");
    focusSel = `input[data-cat="${ci}"][data-item="${draft.categories[ci].items.length - 1}"]`;
  } else if (d.delextra != null) {
    draft.extras.splice(+d.delextra, 1);
  } else if (d.addextra != null) {
    draft.extras.push("");
    focusSel = `input[data-extra="${draft.extras.length - 1}"]`;
  } else return;
  renderEditor();
  if (focusSel) { const el = document.querySelector(focusSel); if (el) el.focus(); }
});

function saveMenu() {
  const seen = new Set();
  const categories = draft.categories.map(c => ({
    name: c.name.trim() || "Ohne Namen",
    icon: c.icon || "ti-coffee",
    items: c.items.map(s => s.trim()).filter(s => s && !seen.has(s.toLowerCase()) && seen.add(s.toLowerCase()))
  })).filter(c => c.items.length);
  if (!categories.length) { alert("Die Karte braucht mindestens ein Getränk."); return; }
  const exSeen = new Set();
  const extras = draft.extras.map(s => s.trim()).filter(s => s && !exSeen.has(s.toLowerCase()) && exSeen.add(s.toLowerCase()));
  menu = { updatedAt: Date.now(), categories, extras };
  try { localStorage.setItem(MENU_KEY, JSON.stringify(menu)); } catch (e) {}
  publish(menuChannel, "menu-update", menu);
  closeEditor();
  showToast("Getränkekarte gespeichert und veröffentlicht");
}

// ── Toast ────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, isError) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = isError ? "var(--red-bg)" : "";
  t.style.borderColor = isError ? "var(--red-border)" : "";
  t.style.color = isError ? "var(--red-text)" : "";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

// ── Start ────────────────────────────────────────────────────────────────────
orders = loadOrders();
let unlocked = false;
try { unlocked = sessionStorage.getItem("kaffee-unlocked") === "1"; } catch (e) {}
if (unlocked) unlock();
else document.getElementById("pin-input").focus();
</script>
